<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182521" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="日本縱貫線" />
    <meta name="description" content="2026 日本縱貫線 Travel Cockpit：每日行程、地圖、住宿交通、地點連結、待辦與雙人旅費記帳。" />
    <title>2026 日本縱貫線 Travel Cockpit</title>
    <link rel="manifest" href="manifest.webmanifest?v=20260609-v5" />
    <link rel="stylesheet" href="styles.css?v=20260609-v5" />
  </head>
  <body>
    <a class="skip-link" href="#today">跳到今日模式</a>

    <header class="app-shell">
      <nav class="top-nav" aria-label="主要導覽">
        <a class="brand" href="#today" aria-label="回到今日模式">
          <span class="brand-mark">縱</span>
          <span>
            <strong>日本縱貫線</strong>
            <small>Travel Cockpit</small>
          </span>
        </a>
        <div class="top-actions">
          <button class="icon-button" id="printBtn" type="button" aria-label="列印">列印</button>
          <button class="icon-button" id="resetBtn" type="button" aria-label="重設">重設</button>
        </div>
      </nav>

      <section class="hero-cockpit" id="today">
        <div class="hero-copy">
          <p class="kicker">北海道 → 東京 → 宮古島</p>
          <h1>今天先看下一步。</h1>
          <p>行程、地圖、預約、支出與待辦集中在同一個作戰台。旅途中不用翻手冊，直接知道現在該做什麼。</p>
        </div>
        <div id="todayCockpit" class="cockpit-card"></div>
      </section>
    </header>

    <main class="main-grid">
      <section class="toolbar" aria-label="搜尋與篩選">
        <label class="field search-field">
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="輸入日期、地點、店名、活動" autocomplete="off" />
        </label>
        <div class="segment-row" id="regionTabs" role="tablist" aria-label="地區篩選"></div>
        <label class="field compact-field">
          <span>類別</span>
          <select id="categoryFilter">
            <option value="all">全部</option>
            <option value="main">主線</option>
            <option value="branch">支線</option>
            <option value="hotel">住宿</option>
            <option value="transport">交通</option>
            <option value="shop">地點餐廳</option>
            <option value="activity">活動</option>
            <option value="expense">記帳</option>
            <option value="task">待辦</option>
          </select>
        </label>
      </section>

      <section class="metric-strip" aria-label="旅行狀態">
        <article>
          <span>旅行天數</span>
          <strong id="daysCount">0</strong>
          <small>6/10-6/27</small>
        </article>
        <article>
          <span>完成度</span>
          <strong id="progressPercent">0%</strong>
          <small id="progressText">0 / 0</small>
        </article>
        <article>
          <span>旅費</span>
          <strong id="expenseTotal">¥0</strong>
          <small id="expenseBalance">尚未記帳</small>
        </article>
        <article>
          <span>待處理</span>
          <strong id="openTasks">0</strong>
          <small>票券與確認</small>
        </article>
      </section>

      <section class="section-panel" id="itinerary">
        <div class="section-head">
          <div>
            <p class="kicker">Timeline</p>
            <h2>每日行程</h2>
          </div>
          <button class="text-button" type="button" data-jump="today">回今日</button>
        </div>
        <div id="itineraryList" class="day-card-grid"></div>
      </section>

      <section class="section-panel split-panel" id="places">
        <div class="section-head">
          <div>
            <p class="kicker">Places</p>
            <h2>地點、餐廳與活動</h2>
          </div>
        </div>
        <div id="placeGrid" class="place-grid"></div>
      </section>

      <section class="section-panel" id="expenses">
        <div class="section-head">
          <div>
            <p class="kicker">Ledger</p>
            <h2>旅費記帳</h2>
          </div>
          <button class="text-button" id="exportCsvBtn" type="button">匯出 CSV</button>
        </div>
        <form id="expenseForm" class="expense-form">
          <label class="field"><span>日期</span><input id="expenseDate" type="text" inputmode="numeric" placeholder="6/14" /></label>
          <label class="field wide-field"><span>項目</span><input id="expenseTitle" type="text" placeholder="咖啡、計程車、晚餐" /></label>
          <label class="field"><span>分類</span><select id="expenseCategory"></select></label>
          <label class="field"><span>金額</span><input id="expenseAmount" type="number" min="0" step="1" placeholder="0" /></label>
          <label class="field"><span>幣別</span><select id="expenseCurrency"><option value="JPY">JPY 日幣</option><option value="TWD">TWD 台幣</option></select></label>
          <label class="field"><span>付款人</span><select id="expensePayer"><option value="husband">老公</option><option value="wife">老婆</option><option value="pending">待補</option></select></label>
          <label class="field wide-field"><span>備註</span><input id="expenseNote" type="text" placeholder="可留空" /></label>
          <div class="expense-live" id="expenseLive">輸入金額後自動換算</div>
          <button class="primary-button" type="submit">新增一筆</button>
        </form>
        <div id="expenseSummary" class="expense-summary"></div>
        <div id="expenseList" class="expense-list"></div>
      </section>

      <section class="section-panel" id="tasks">
        <div class="section-head">
          <div>
            <p class="kicker">Checklist</p>
            <h2>待辦與提醒</h2>
          </div>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>

      <section class="section-panel" id="bookings">
        <div class="section-head">
          <div>
            <p class="kicker">Bookings</p>
            <h2>住宿與交通</h2>
          </div>
        </div>
        <div id="bookingList" class="booking-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="手機導覽">
      <a href="#today">今日</a>
      <a href="#itinerary">行程</a>
      <a href="#places">地點</a>
      <a href="#expenses">記帳</a>
      <a href="#tasks">待辦</a>
    </nav>

    <dialog id="detailDialog">
      <button class="dialog-close" type="button" aria-label="關閉">×</button>
      <div id="dialogContent"></div>
    </dialog>

    <script src="data/trip-data.js?v=20260609-v5"></script>
    <script src="data/trip-updates.js?v=20260609-v5"></script>
    <script src="data/visual-assets.js?v=20260609-v5"></script>
    <script src="data/expense-seeds.js?v=20260609-v5"></script>
    <script src="app.js?v=20260609-v5"></script>
  </body>
</html>
